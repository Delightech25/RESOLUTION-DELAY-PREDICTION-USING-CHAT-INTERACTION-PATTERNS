{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="row">
    <div class="col-md-6">
        <div class="card shadow mb-4">
            <div class="card-body">
                <h4 class="card-title">Train Model</h4>
                <form action="/train" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input type="file" name="file" class="form-control" required>
                    </div>
                    <button class="btn btn-warning w-100">Train Model</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow mb-4">
            <div class="card-body">
                <h4 class="card-title">Predict Delay</h4>
                <form action="/predict" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input type="file" name="file" class="form-control" required>
                    </div>
                    <button class="btn btn-primary w-100">Predict</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
